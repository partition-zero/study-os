{% extends 'base.html' %}

{% block content %}
<div class="w-full max-w-4xl grid md:grid-cols-2 gap-8 items-center">
    <!-- Hero Text -->
    <div class="space-y-4">
        <h1 class="text-4xl font-extrabold text-slate-900 leading-tight">Master your schedule.<br>Ace your classes.</h1>
        <p class="text-lg text-slate-600">Study OS automatically builds your perfect study schedule so you can focus on learning, not planning.</p>
    </div>

    <!-- Auth Form Card -->
    <div class="bg-white p-8 rounded-xl shadow-lg border border-slate-100">
        <h2 class="text-2xl font-bold mb-6 text-center">Access your Workspace</h2>
        
        {% if error %}
            <p class="text-red-500 text-sm mb-4 text-center font-bold">{{ error }}</p>
        {% endif %}

        <form action="{% url 'login' %}" method="POST" class="space-y-4">
            {% csrf_token %}
            <div>
                <label class="block text-sm font-medium text-slate-700 mb-1">Username / Email</label>
                <input type="text" name="email" class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none" required>
            </div>
            <div>
                <label class="block text-sm font-medium text-slate-700 mb-1">Password</label>
                <input type="password" name="password" class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none" required>
            </div>
            <button type="submit" class="w-full bg-indigo-600 text-white font-bold py-3 rounded-lg hover:bg-indigo-700 transition">
                Log In
            </button>
        </form>
    </div>
</div>
{% endblock %}

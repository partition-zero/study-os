#file
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Study OS | Your Academic Operating System</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 text-slate-800 font-sans min-h-screen flex flex-col">

    <!-- NAVIGATION BAR -->
    <nav class="bg-indigo-600 text-white shadow-md">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between items-center h-16">
                <a href="{% url 'landing' %}" class="flex-shrink-0 font-bold text-2xl tracking-tight">
                    📚 Study OS
                </a>
                
                <div class="hidden md:flex space-x-8 items-center">
                    <a href="#" class="hover:text-indigo-200 transition">Features</a>
                    <a href="#" class="hover:text-indigo-200 transition">About</a>
                </div>

                <div class="flex space-x-4 items-center">
                    {% if user.is_authenticated %}
                        <span class="font-medium">👋 {{ user.username }}</span>
                        <a href="{% url 'logout' %}" class="bg-indigo-700 px-4 py-2 rounded-md text-sm font-bold hover:bg-indigo-800 transition">Log Out</a>
                    {% else %}
                        <a href="{% url 'landing' %}" class="text-white hover:text-indigo-200 font-medium">Log In</a>
                    {% endif %}
                </div>
            </div>
        </div>
    </nav>

    <!-- MAIN CONTENT INJECTED HERE -->
    <main class="flex-grow flex items-center justify-center p-6">
        {% block content %}
        {% endblock content %}
    </main>

</body>
</html>

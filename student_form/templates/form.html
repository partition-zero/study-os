<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" type="text/css" href="form.css">
    <title>Study OS | Form</title>
    <header>
        <nav>
            <ul>
                <li>
                    <a href="{% url 'home' %}">Home</a>
                </li>
            </ul>
        </nav>
    </header>
</head>
<body>
    <div>
        <form method="POST">
            {% csrf_token %}

            {% if from.non_field_errors %}
                <div class='text-danger'>
                    {{ form.non_field_errors }}
                </div>
            {% endif %}

            {% for field in form %}
                <div class='form-group-mb-3'>
                    <label for='{{ field.if_for_label }}' class='form-label'>
                        {{ field.label }}
                    </label>
                    <div class="field">
                        {{ field }}
                    </div>


                    {% if field.errors %}
                        <div class='text-danger'>
                            {{ field.errors }}
                        </div>
                    {% endif %}
                </div>
            {% endfor %}
            <button type="submit" class='save-btn'>Save</button>
        </form>
    </div>
</body>
</html>
